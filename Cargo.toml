[package]
name = "bitiodine"
version = "0.1.0"
authors = ["Michele Spagnuolo <miki@miki.it>"]
edition = "2021"
rust-version = "1.75"
description = "A fast Bitcoin blockchain parser with address clustering capabilities"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mikispag/bitiodine"
readme = "README.md"
keywords = ["bitcoin", "blockchain", "parser", "clustering"]
categories = ["cryptography::cryptocurrencies", "parser-implementations"]

[dependencies]
bitcoin-bech32 = "0.13.0"
bs58 = "0.5.1"
chrono = "0.4.40"
clap = { version = "4.5.31", features = ["derive"] }
dirs = "6.0.0"
env_logger = "0.11.7"
hex = "0.4.3"
log = "0.4.26"
memmap2 = "0.9.5"
ripemd = "0.1.3"
sha2 = "0.10.8"
thiserror = "2.0.11"
smallvec = { version = "1.13", features = ["union"] }

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
lto = "thin"
codegen-units = 1
